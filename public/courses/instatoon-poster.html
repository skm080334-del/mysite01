<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>인스타툰 만들기 3일 교육과정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  /* 사이트와 같은 남색·보라 톤 */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 100% 0%, #a855f759, transparent 40%),
      radial-gradient(circle at 0% 100%, #a855f740, transparent 40%),
      #0b0b2e;
    color: #f5f3ff;
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
  }
  .bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px max(16px, calc((100% - 760px) / 2));
    background: #0b0b2ecc;
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #2c2c6b;
  }
  .homebtn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: 99px;
    background: linear-gradient(110deg, #2f3cf0, #a855f7);
    color: #fff; text-decoration: none; font-size: 14px; font-weight: 700;
    box-shadow: 0 8px 30px -8px #a855f7;
  }
  .homebtn:hover { filter: brightness(1.1); }
  .title { font-size: 15px; font-weight: 700; color: #d4c2fc; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 56px; }
  img {
    display: block; width: 100%; height: auto;
    border-radius: 20px;
    box-shadow: 0 0 60px -12px #a855f7aa;
  }
  .poster { position: relative; }
  /* 포스터 그림 속 다운로드 버튼 두 개가 있는 자리 (이미지 크기 기준 % 위치라 화면 크기가 바뀌어도 맞음) */
  .hotspot {
    position: absolute;
    left: 3.5%; width: 93.5%;
    top: 87.2%; height: 11.4%;
    border-radius: 28px;
    transition: background-color .2s, box-shadow .2s;
  }
  .hotspot:hover { background: #ffffff26; box-shadow: 0 0 0 3px #fff9; }
  .morebtn {
    display: block; margin-top: 20px; padding: 16px; border-radius: 16px;
    text-align: center; text-decoration: none; font-weight: 700; color: #f5f3ff;
    background: #16164ab3; border: 1px solid #d4c2fc38;
  }
  .morebtn:hover { background: #a855f7; }
  @media (max-width: 480px) { .title { display: none; } }
</style>
</head>
<body>
  <div class="bar">
    <a class="homebtn" href="/#courses">← 홈으로</a>
    <span class="title">인스타툰 만들기 3일 교육과정</span>
  </div>
  <main>
    <div class="poster">
    <img
      src="/courses/instatoon-poster.webp"
      alt="인스타툰 만들기 3일 교육과정 안내: 하루 3시간씩 총 3일(9시간) 동안 나만의 인스타툰 완성. 1일차 캐릭터와 아이디어 만들기(인스타툰 이해, 주제 정하기, 캐릭터 디자인, 4컷 콘티 작성), 2일차 컷 구성과 대사 넣기(컷 구성 연습, 말풍선 넣기, 대사 쓰기, 디지털 드로잉 실습), 3일차 완성과 업로드 준비(작품 마무리, 제목·캡션 작성, 표지 이미지 만들기, 발표와 공유). 기획, 드로잉, 편집, 업로드를 배웁니다."
    />
    <!-- 포스터 아래 "교안 다운로드 / 강의계획서 다운로드" 그림 위에 겹친 투명 버튼 (둘 다 같은 페이지로) -->
    <a class="hotspot" href="/courses/instatoon-3day.html" aria-label="교안 · 강의계획서 보기"></a>
    </div>
    <!-- 자세한 강의계획서·강사용 교안 페이지로 이동 -->
    <a class="morebtn" href="/courses/instatoon-3day.html">강의계획서 · 강사용 교안 자세히 보기 →</a>
  </main>
</body>
</html>
